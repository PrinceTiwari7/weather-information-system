<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App - Home</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div class="container">
		<h1>Simple Weather App</h1>
		<p>Check the weather forecast for any place!</p>

		<form id="weatherForm" action="MyServlet" method="post">
			<div class="input-wrapper">
				<input type="text" id="city" name="city"
					placeholder="Enter a city name">
				<button type="submit">
					<i class="fas fa-search"></i> Get Weather
				</button>
				<p id="errorMsg"
					style="color: red; padding: 6px 6px; display: none;">Please
					enter the name of the place.</p>
			</div>
		</form>
	</div>

	<div class="container" id="weatherDetailsContainer" style="display: none; margin-top: 20px;">
		<h1>Weather Details</h1>

		<div class="weather-image-container">
			<img id="weather-icon" src="images/img1.png" alt="Weather Image">
			<div class="temp-city">
				<h2 id="displayCity">
					<i class="fas fa-city"></i>
				</h2>
				<h2 id="displayTemp">
					<i class="fas fa-thermometer-half"></i>
				</h2>
			</div>
		</div>

		<div class="weather-info">
			<p>
				<i class="fas fa-calendar-alt"></i> Date: <span id="displayDate"></span>
			</p>
			<p>
				<i class="fas fa-clock"></i> CurrentTime: <span id="displayTime"></span>
			</p>
			<p>
				<i class="fas fa-cloud-sun"></i> Condition: <span id="displayCondition"></span>
			</p>
			<p>
				<i class="fas fa-eye"></i> Visibility: <span id="displayVisibility"></span>km
			</p>
			<p>
				<i class="fas fa-wind"></i> WindSpeed: <span id="displayWindSpeed"></span>km/hr
			</p>
			<p>
				<i class="fas fa-cloud"></i> CloudCover: <span id="displayCloudCover"></span>%
			</p>
		</div>
	</div>
	<script src="script.js"></script>
</body>

<footer>
	<div class="footer-container">
		<p>Developed by Prince Tiwari @ 2026 | JAVA Servlet JSP Dynamic
			Web Project</p>
	</div>
</footer>

</html>
